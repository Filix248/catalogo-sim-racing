<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Cockpit de sim racing</title>
  <desc id="desc">Ilustración original de un cockpit de carreras con monitor panorámico, volante, pedales y asiento deportivo sobre una plataforma iluminada en azul.</desc>
  <defs>
    <radialGradient id="halo"><stop stop-color="#386BE6" stop-opacity=".3"/><stop offset="1" stop-color="#386BE6" stop-opacity="0"/></radialGradient>
    <linearGradient id="base" x1="200" y1="300" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#263349"/><stop offset=".5" stop-color="#101824"/><stop offset="1" stop-color="#1D2B42"/></linearGradient>
    <linearGradient id="edge" x1="230" y1="320" x2="750" y2="450" gradientUnits="userSpaceOnUse"><stop stop-color="#7AA7FF"/><stop offset=".55" stop-color="#253D65"/><stop offset="1" stop-color="#6398FF"/></linearGradient>
    <linearGradient id="metal" x1="460" y1="200" x2="640" y2="400" gradientUnits="userSpaceOnUse"><stop stop-color="#56677F"/><stop offset=".35" stop-color="#233044"/><stop offset="1" stop-color="#10151F"/></linearGradient>
    <linearGradient id="seat" x1="650" y1="130" x2="820" y2="330" gradientUnits="userSpaceOnUse"><stop stop-color="#34445D"/><stop offset=".45" stop-color="#192537"/><stop offset="1" stop-color="#0D1420"/></linearGradient>
    <linearGradient id="screen" x1="260" y1="100" x2="570" y2="250" gradientUnits="userSpaceOnUse"><stop stop-color="#121F35"/><stop offset=".5" stop-color="#080E18"/><stop offset="1" stop-color="#203C63"/></linearGradient>
    <linearGradient id="road" x1="320" y1="120" x2="410" y2="240" gradientUnits="userSpaceOnUse"><stop stop-color="#1E3550"/><stop offset="1" stop-color="#3E5D7C"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.6"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
